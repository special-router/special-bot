server {
    listen 80;
    listen [::]:80;
    server_name special-wifi.link;

    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name special-wifi.link;

    ssl_certificate /etc/letsencrypt/live/special-wifi.link/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/special-wifi.link/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:special_wifi_link_tls:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    access_log off;

    location ^~ /sub/ {
        # The existing RU host keeps a memory-only, digest-keyed LKG. Fresh
        # documents do not need BOT; on origin failure only an already verified
        # warm document is served stale. No bearer path is persisted to disk.
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
        proxy_buffering on;
    }

    location ^~ /api/v1/vpn/box/ {
        proxy_pass http://72.56.23.226:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location ^~ /api/v1/vpn/router/ {
        proxy_pass http://72.56.23.226:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
