name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate repository docs and scripts
        run: |
          python ops/scripts/validate_repository.py
          python -m unittest ops/scripts/test_validate_origins.py
          python ops/scripts/validate_origins.py ops/origins.example.json
          bash -n entrypoint.sh ops/scripts/*.sh
      - name: Check Django migrations
        env:
          DJANGO_SETTINGS_MODULE: bot.settings
          DATABASE_URL: sqlite:///:memory:
          CELERY_ALWAYS_EAGER: 'true'
        run: python manage.py makemigrations --check --dry-run
      - name: Run test suite
        env:
          DJANGO_SETTINGS_MODULE: bot.settings
          DATABASE_URL: sqlite:///:memory:
          CELERY_ALWAYS_EAGER: 'true'
        run: python -m pytest -q
