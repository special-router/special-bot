services:
  postgres:
    image: postgres:16
    env_file:
      - .environment
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vpnbot}
      POSTGRES_USER: ${POSTGRES_USER:-vpnbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpnbot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c listen_addresses=*
      -c port=5432

  redis:
    image: redis:7
    env_file:
      - .environment
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "MyRedis2025"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro

  web:
    build: .
    image: vpnbot:latest
    command: ["sh", "-c", "./entrypoint.sh python manage.py start_bot"]
    env_file:
      - .environment
    environment:
      DJANGO_SETTINGS_MODULE: bot.settings
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vpnbot}
      POSTGRES_USER: ${POSTGRES_USER:-vpnbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpnbot}
      DATABASE_URL: postgres://${POSTGRES_USER:-vpnbot}:${POSTGRES_PASSWORD:-vpnbot}@postgres:5432/${POSTGRES_DB:-vpnbot}
      REDIS_URL: redis://:MyRedis2025@redis:6379/0
    depends_on:
      - postgres
      - redis

  django_web:
    build: .
    image: vpnbot:latest
    command: ["sh", "-c", "./entrypoint.sh python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"]
    env_file:
      - .environment
    environment:
      DJANGO_SETTINGS_MODULE: bot.settings
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vpnbot}
      POSTGRES_USER: ${POSTGRES_USER:-vpnbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpnbot}
      DATABASE_URL: postgres://${POSTGRES_USER:-vpnbot}:${POSTGRES_PASSWORD:-vpnbot}@postgres:5432/${POSTGRES_DB:-vpnbot}
      REDIS_URL: redis://:MyRedis2025@redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  celery:
    image: vpnbot:latest
    build: .
    command: ["sh", "-c", "./entrypoint.sh celery -A bot.celery_app worker --loglevel=INFO --queues=celery"]
    env_file:
      - .environment
    environment:
      DJANGO_SETTINGS_MODULE: bot.settings
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vpnbot}
      POSTGRES_USER: ${POSTGRES_USER:-vpnbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpnbot}
      DATABASE_URL: postgres://${POSTGRES_USER:-vpnbot}:${POSTGRES_PASSWORD:-vpnbot}@postgres:5432/${POSTGRES_DB:-vpnbot}
      REDIS_URL: redis://:MyRedis2025@redis:6379/0
    depends_on:
      - postgres
      - redis

  celery_beat:
    image: vpnbot:latest
    build: .
    command: ["sh", "-c", "./entrypoint.sh celery -A bot.celery_app beat --loglevel=INFO"]
    env_file:
      - .environment
    environment:
      DJANGO_SETTINGS_MODULE: bot.settings
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vpnbot}
      POSTGRES_USER: ${POSTGRES_USER:-vpnbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpnbot}
      DATABASE_URL: postgres://${POSTGRES_USER:-vpnbot}:${POSTGRES_PASSWORD:-vpnbot}@postgres:5432/${POSTGRES_DB:-vpnbot}
      REDIS_URL: redis://:MyRedis2025@redis:6379/0
    depends_on:
      - postgres
      - redis

  monitoring:
    profiles:
      - monitoring
    image: vpnbot-monitoring:latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.monitoring
    command: ["sh", "-c", "./entrypoint.sh celery -A bot.celery_app worker --loglevel=INFO --queues=monitoring --concurrency=1"]
    env_file:
      - .environment
    environment:
      DJANGO_SETTINGS_MODULE: bot.settings
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vpnbot}
      POSTGRES_USER: ${POSTGRES_USER:-vpnbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpnbot}
      DATABASE_URL: postgres://${POSTGRES_USER:-vpnbot}:${POSTGRES_PASSWORD:-vpnbot}@postgres:5432/${POSTGRES_DB:-vpnbot}
      REDIS_URL: redis://:MyRedis2025@redis:6379/0
      SPECIAL_MONITOR_XRAY_PATH: /usr/local/bin/xray
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pgdata:


