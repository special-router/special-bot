services:
  postgres:
    image: postgres:16
    env_file:
      - .environment
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vpnbot}
      POSTGRES_USER: ${POSTGRES_USER:-vpnbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vpnbot}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c listen_addresses=*
      -c port=5432

  redis:
    image: redis:7
    env_file:
      - .environment
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "MyRedis2025"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro

volumes:
  pgdata:
