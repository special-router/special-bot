# Deploy-only compose: app services join the existing vpn_bot_default network.
# Postgres and Redis are intentionally NOT declared here; they are owned by the
# vpn_bot project. Declaring them would hijack their network aliases.
services:
  web:
    image: vpnbot:latest
    command: ["sh", "-c", "./entrypoint.sh sh -c 'gunicorn bot.wsgi:application --bind 0.0.0.0:8001 --workers 1 --threads 4 --log-level warning & python manage.py start_bot'"]
    env_file: [.environment]
    environment:
      DJANGO_SETTINGS_MODULE: bot.settings
      RUN_MIGRATIONS: "false"
      SUBSCRIPTION_BACKUP_SECRET_FILE: /run/secrets/subscription-backup.json
    volumes:
      - ${SUBSCRIPTION_BACKUP_SECRET_HOST_PATH:-/dev/null}:/run/secrets/subscription-backup.json:ro
    ports:
      - "72.56.23.226:8001:8001"
    restart: unless-stopped

  celery:
    image: vpnbot:latest
    command: ["sh", "-c", "./entrypoint.sh celery -A bot.celery_app worker --loglevel=INFO --queues=celery --pool=solo"]
    env_file: [.environment]
    environment:
      DJANGO_SETTINGS_MODULE: bot.settings
      RUN_MIGRATIONS: "false"
    restart: unless-stopped

  broadcast:
    image: vpnbot:latest
    command: ["sh", "-c", "./entrypoint.sh celery -A bot.celery_app worker --loglevel=INFO --queues=safe_broadcast_v1 --pool=solo --concurrency=1"]
    env_file: [.environment]
    environment:
      DJANGO_SETTINGS_MODULE: bot.settings
      RUN_MIGRATIONS: "false"
    restart: unless-stopped

  celery_beat:
    image: vpnbot:latest
    command: ["sh", "-c", "./entrypoint.sh celery -A bot.celery_app beat --loglevel=INFO"]
    env_file: [.environment]
    environment:
      DJANGO_SETTINGS_MODULE: bot.settings
      RUN_MIGRATIONS: "false"
    restart: unless-stopped

  monitoring:
    image: vpnbot:latest
    command: ["sh", "-c", "./entrypoint.sh celery -A bot.celery_app worker --loglevel=INFO --queues=monitoring --pool=solo"]
    env_file: [.environment]
    environment:
      DJANGO_SETTINGS_MODULE: bot.settings
      RUN_MIGRATIONS: "false"
      SPECIAL_MONITOR_XRAY_PATH: /usr/local/bin/xray
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  default:
    external: true
    name: vpn_bot_default
