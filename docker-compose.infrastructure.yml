# Canonical shared infrastructure for SPECIAL Bot.
# Import the existing named volumes/network on first adoption; never recreate
# PostgreSQL data as part of an ordinary app deployment.
services:
  postgres:
    image: postgres:16
    env_file: [.environment]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command: ["postgres", "-c", "listen_addresses=*", "-c", "port=5432"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    env_file: [.environment]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped

networks:
  default:
    external: true
    name: vpn_bot_default

volumes:
  pgdata:
    external: true
    name: vpn_bot_pgdata
  redis_data:
    external: true
    # Current production uses this external volume; replace only through an
    # explicit data-volume migration, never by ordinary Compose recreation.
    name: 30e0d25e3770503c6f3fb6242f9dfdd5f542a3ffd5b2fe1c950f455540033d92
