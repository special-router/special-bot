[project]
name = "vpnbot"
version = "0.1.0"
description = "..."
requires-python = ">=3.13"
# Every dependency is pinned, and that is deliberate. This is an application
# with one deployment, not a library resolving against someone else's tree.
# An unpinned entry here is what let a venv resolve py3xui 0.7.0 while the
# image ran 0.5.1 — two versions that address panel clients through different
# URLs — and the whole test suite validated the wrong one for as long as it
# took someone to look. Upgrading should cost an edit here; drifting should
# cost nothing less. `ops/scripts/validate_repository.py` enforces the match.
dependencies = [
    'python-telegram-bot==22.8',
    'django==5.2.6',
    'django-environ==0.12.0',
    'py3xui==0.5.1',
    'celery==5.5.3',
    'redis==6.4.0',
    'psycopg[binary]==3.2.10',
    'djangorestframework==3.15.2',
    'Pillow==11.0.0',
    'gunicorn==23.0.0',
    'whitenoise==6.11.0',
]
[tool.isort]
profile = 'black'
line_length = 120
lines_after_imports = 2
lines_between_sections = 1
lines_between_types = 0
force_alphabetical_sort_within_sections = true
ensure_newline_before_comments = true
combine_as_imports = true
combine_star = true
skip_gitignore = true
balanced_wrapping = true

[tool.black]
line-length = 120
skip-string-normalization = true

[tool.flake8]
max-line-length = 120
extend-ignore = ['E704', 'E701']